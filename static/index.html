<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CyberGuard AI | مساعد الأمن السيبراني</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-icon">🛡️</div>
        <div class="brand-text">
          <h1>CyberGuard AI</h1>
          <span>مساعد الأمن السيبراني</span>
        </div>
      </div>

      <div class="sidebar-content">
        <div class="section">
          <h3 class="section-title">نطاق المشروع</h3>
          <div class="scope-box">
            <strong>التخصص</strong>
            <p>المساعد يجيب عن الأسئلة التعليمية المتعلقة بالأمن السيبراني فقط.</p>
          </div>
        </div>

        <div class="section">
          <h3 class="section-title">المواضيع الشائعة</h3>
          <button class="topic-btn" data-q="ما هو الأمن السيبراني وما أهم أهدافه؟">• مقدمة في الأمن السيبراني</button>
          <button class="topic-btn" data-q="اشرح لي مفهوم SOC ودور محلل الأمن فيه">• SOC ومستوى الأمان</button>
          <button class="topic-btn" data-q="ما الفرق بين التشفير المتماثل وغير المتماثل؟">• التشفير وأنواعه</button>
          <button class="topic-btn" data-q="اشرح لي SIEM بطريقة بسيطة">• SIEM والتحليل</button>
          <button class="topic-btn" data-q="ما هي أشهر أنواع هجمات الويب؟">• هجمات الويب</button>
        </div>

        <button class="clear-btn" id="clearBtn">🗑️ مسح المحادثة</button>
      </div>
    </aside>

    <!-- Overlay for mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Chat -->
    <main class="chat-container">
      <header class="chat-header">
        <div class="chat-header-info">
          <h2>مساعدك التعليمي في الأمن السيبراني</h2>
          <p>مدعوم بـ Gemini API</p>
        </div>
        <div class="connection-status">
          <span class="status-dot"></span>
          <span>متصل</span>
        </div>
      </header>

      <div class="messages-wrapper">
        <div class="messages-container" id="messages"></div>
        <div class="typing-indicator" id="typing">
          <span></span><span></span><span></span>
        </div>
      </div>

      <div class="chat-composer">
        <form class="composer-form" id="chatForm">
          <div class="composer-wrapper">
            <textarea class="composer-input" id="input" rows="1" placeholder="اكتب سؤالك في الأمن السيبراني..." required></textarea>
          </div>
          <button class="send-btn" type="submit" aria-label="إرسال">➤</button>
        </form>
        <p class="disclaimer">المشروع تعليمي. لا تستخدم الشروحات ضد أنظمة دون تصريح.</p>
      </div>
    </main>

    <!-- Mobile Toggle Button -->
    <button class="mobile-toggle" id="mobileToggle">☰</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
